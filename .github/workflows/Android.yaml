name: Safe Drive CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  validate_and_build:
    name: Validate, Test & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code quality & static analysis
        run: flutter analyze --fatal-warnings

      - name: Run unit tests
        run: flutter test test/unit/

      - name: Verify offline ML Kit dependency (Bundled assertion)
        run: |
          echo "Verifying offline bundled ML Kit configuration..."
          cd android
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath > deps.txt
          if grep -q "com.google.android.gms:play-services-mlkit-face-detection" deps.txt; then
            echo "ERROR: Dynamic Play Services ML Kit detected! Must use offline bundled model."
            exit 1
          fi
          if ! grep -q "com.google.mlkit:face-detection:16.1.7" deps.txt; then
            echo "ERROR: Offline bundled ML Kit (16.1.7) not found in dependency graph!"
            exit 1
          fi
          echo "Offline ML Kit assertion passed: com.google.mlkit:face-detection:16.1.7 is strictly bundled."
          cd ..

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-abi-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
